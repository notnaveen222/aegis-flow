rules:
  - id: pan-in-logs
    languages: [generic]
    severity: ERROR
    message: >-
      Raw card number (PAN) passed directly to a logging/print call. Card
      numbers must never reach logs outside PCI scope — mask with
      tokenize.mask() first. PCI DSS requirement 3.3: never display more
      than the first six and last four digits of a PAN.
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      category: security
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/532.html
    paths:
      include:
        - "*.py"
    patterns:
      - pattern-regex: '\b(?:log|logger|logging)\.\w+\([^)\n]*\bcard_number\b'
      - pattern-not-regex: '\bmask\([^)\n]*\bcard_number\b'

  - id: jwt-missing-expiry
    languages: [python]
    severity: ERROR
    message: >-
      jwt.encode() is called on a payload dict that never gets an "exp"
      claim. A JWT without expiry is a permanent credential: one leaked
      token equals one permanently compromised account.
    metadata:
      cwe: "CWE-613: Insufficient Session Expiration"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/613.html
    patterns:
      - pattern-inside: |
          def $FUNC(...):
              ...
              jwt.encode($PAYLOAD, ...)
              ...
      - pattern: $PAYLOAD = {...}
      - pattern-not: '$PAYLOAD = {..., "exp": $EXP, ...}'

  - id: tls-verify-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate verification is explicitly disabled (verify=False).
      Any host on the network path can impersonate the server, read every
      payload, and return forged responses — the classic "it failed in
      staging so I turned it off" fix that ships to production.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/295.html
    patterns:
      - pattern-either:
          - pattern: requests.$METHOD(..., verify=False, ...)
          - pattern: requests.Session(...).$METHOD(..., verify=False, ...)
          - pattern: httpx.Client(..., verify=False, ...)
          - pattern: httpx.AsyncClient(..., verify=False, ...)
          - pattern: httpx.$METHOD(..., verify=False, ...)
