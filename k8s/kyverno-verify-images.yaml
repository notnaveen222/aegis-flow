# Requires every Pod in the aegisflow namespace whose image comes from this
# project's GHCR path to carry a valid keyless Cosign signature from this
# exact repo's GitHub Actions workflow. Anything else — unsigned, signed by
# someone else's workflow, signed by a different repo — is rejected at
# admission, not just flagged after the fact.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-ghcr-image-signatures
spec:
  webhookTimeoutSeconds: 30
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-aegisflow-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - aegisflow
      verifyImages:
        - imageReferences:
            - "ghcr.io/notnaveen222/aegis-flow-*"
          mutateDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/notnaveen222/aegis-flow/.github/workflows/pipeline.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
