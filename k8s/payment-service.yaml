apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: aegisflow
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      # SEEDED FLAW #10: privileged pod, no resource limits.
      # Expected detector: Checkov CKV_K8S_16 (privileged), CKV_K8S_10/11/12/13
      # (missing requests/limits).
      automountServiceAccountToken: false
      containers:
        - name: payment-service
          image: ghcr.io/notnaveen222/aegis-flow-payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          securityContext:
            privileged: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aegisflow-secrets
                  key: payment-database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aegisflow-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: aegisflow
spec:
  selector:
    app: payment-service
  ports:
    - port: 8000
      targetPort: 8000
