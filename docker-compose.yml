# aegisFlow local stack. Start with:  docker compose up --build
# Requires a .env file (copy .env.example) providing POSTGRES_PASSWORD and JWT_SECRET.

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` on purpose. Only the two services on this network can reach the DB.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./services/auth-service
    image: aegisflow/auth-service:dev
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    image: aegisflow/payment-service:dev
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
