name: aegisFlow Security Pipeline

# Every scan stage reports findings as SARIF and does NOT fail the job on its
# own. The policy-gate job is the single place that decides pass/fail, by
# evaluating every SARIF file plus the waiver list through OPA/Conftest. This
# is what "gated by OPA/Rego policies with expiring waivers" means in
# practice: scanners report, one policy decides.

on:
  push:
    branches: [main, vulnerable]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: Gitleaks scans every past commit too

      - name: Run Gitleaks
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --log-opts="HEAD" \
            --report-format=sarif --report-path=/repo/reports/gitleaks.sarif \
            --redact --exit-code=0

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

      - name: Upload SARIF artifact for policy gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-gitleaks
          path: reports/gitleaks.sarif
          retention-days: 14

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan \
            --config .semgrep/rules.yml \
            --config p/python \
            --config p/security-audit \
            --sarif --output reports/semgrep.sarif \
            services/ \
          || true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Upload SARIF artifact for policy gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-semgrep
          path: reports/semgrep.sarif
          retention-days: 14

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      auth-image: ${{ steps.meta.outputs.auth-image }}
      payment-image: ${{ steps.meta.outputs.payment-image }}
      auth-digest: ${{ steps.build-auth.outputs.digest }}
      payment-digest: ${{ steps.build-payment.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "auth-image=ghcr.io/${REPO_LOWER}-auth-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "payment-image=ghcr.io/${REPO_LOWER}-payment-service:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push auth-service
        id: build-auth
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          push: true
          tags: ${{ steps.meta.outputs.auth-image }}

      - name: Build & push payment-service
        id: build-payment
        uses: docker/build-push-action@v6
        with:
          context: services/payment-service
          push: true
          tags: ${{ steps.meta.outputs.payment-image }}

  sca-sbom:
    name: SCA + SBOM (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOMs (CycloneDX)
        run: |
          mkdir -p reports/sbom
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest fs \
            --format cyclonedx --output reports/sbom/auth-service.cdx.json \
            services/auth-service
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest fs \
            --format cyclonedx --output reports/sbom/payment-service.cdx.json \
            services/payment-service

      - name: Dependency vulnerability scan (SARIF)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest fs \
            --scanners vuln --ignore-unfixed --format sarif --output reports/trivy-sca.sarif \
            services/ \
          || true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-sca.sarif
          category: trivy-sca

      - name: Upload SARIF artifact for policy gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-trivy-sca
          path: reports/trivy-sca.sarif
          retention-days: 14

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: reports/sbom/
          retention-days: 14

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.auth-image }}
          format: sarif
          output: reports/trivy-auth-image.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan payment-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.payment-image }}
          format: sarif
          output: reports/trivy-payment-image.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload auth-service SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-auth-image.sarif
          category: trivy-image-auth-service

      - name: Upload payment-service SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-payment-image.sarif
          category: trivy-image-payment-service

      - name: Upload SARIF artifacts for policy gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-trivy-image
          path: |
            reports/trivy-auth-image.sarif
            reports/trivy-payment-image.sarif
          retention-days: 14

  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src bridgecrew/checkov:latest \
            -d k8s/ -o sarif --output-file-path reports --quiet \
          || true
          mv reports/results_sarif.sarif reports/checkov.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov.sarif
          category: checkov

      - name: Upload SARIF artifact for policy gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-checkov
          path: reports/checkov.sarif
          retention-days: 14

  dast:
    name: Integration tests + DAST (ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_SECRET: ci-only-jwt-secret-not-for-prod-use
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health >/dev/null && curl -sf http://localhost:8002/health >/dev/null; then
              echo "services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "services did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Run integration tests
        id: pytest
        continue-on-error: true
        run: |
          pip install -r tests/requirements.txt
          pytest -v

      - name: Run ZAP baseline scans
        if: always()
        run: |
          mkdir -p reports
          chmod 777 reports # the zap container writes as its own internal uid
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" \
            zaproxy/zap-stable zap-baseline.py -t http://localhost:8001 -J zap-auth.json -I
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" \
            zaproxy/zap-stable zap-baseline.py -t http://localhost:8002 -J zap-payment.json -I

      - name: Convert ZAP reports to SARIF
        if: always()
        run: |
          python3 scripts/zap_to_sarif.py reports/zap-auth.json reports/zap-auth.sarif
          python3 scripts/zap_to_sarif.py reports/zap-payment.json reports/zap-payment.sarif

      - name: Upload auth-service SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/zap-auth.sarif
          category: zap-auth-service

      - name: Upload payment-service SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/zap-payment.sarif
          category: zap-payment-service

      - name: Upload SARIF artifacts for policy gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-zap
          path: |
            reports/zap-auth.sarif
            reports/zap-payment.sarif
          retention-days: 14

      - name: Fail the job if integration tests failed
        if: always() && steps.pytest.outcome == 'failure'
        run: |
          echo "::error::Integration tests failed (see 'Run integration tests' above) — this is how IDOR and similar business-logic flaws get caught, since no scanner in this pipeline models resource ownership."
          exit 1

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  policy-gate:
    name: Policy gate (OPA/Conftest)
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, sca-sbom, container-scan, iac-scan, dast]
    if: always()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sarif-*
          path: reports
          merge-multiple: true

      - name: Evaluate every SARIF file against the gate policy
        run: |
          FAILED=0
          for f in $(find reports -name '*.sarif'); do
            echo "::group::conftest $f"
            docker run --rm -v "$PWD:/src" -w /src openpolicyagent/conftest:latest \
              test --policy policy/gate.rego --data policy/waivers.yml \
              --parser json "$f" || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED

  sign-and-verify:
    name: Sign images (Cosign) + Kyverno admission demo
    runs-on: ubuntu-latest
    needs: [build-and-push, policy-gate]
    if: |
      needs.build-and-push.result == 'success' &&
      needs.policy-gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign images keylessly (GitHub OIDC)
        run: |
          cosign sign --yes "${{ needs.build-and-push.outputs.auth-image }}@${{ needs.build-and-push.outputs.auth-digest }}"
          cosign sign --yes "${{ needs.build-and-push.outputs.payment-image }}@${{ needs.build-and-push.outputs.payment-digest }}"

      - name: Verify signatures
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ needs.build-and-push.outputs.auth-image }}@${{ needs.build-and-push.outputs.auth-digest }}"
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/pipeline.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ needs.build-and-push.outputs.payment-image }}@${{ needs.build-and-push.outputs.payment-digest }}"

      - name: Build & push an intentionally unsigned decoy image
        run: |
          printf 'FROM alpine:3.20\nCMD ["true"]\n' > Dockerfile.unsigned
          docker build -f Dockerfile.unsigned -t "${{ needs.build-and-push.outputs.auth-image }}-unsigned-demo" .
          docker push "${{ needs.build-and-push.outputs.auth-image }}-unsigned-demo"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: aegisflow-demo

      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno -n kyverno --create-namespace --wait --timeout 5m

      - name: Apply the image-verification policy
        run: |
          kubectl apply -f k8s/kyverno-verify-images.yaml
          sleep 15 # let Kyverno's webhook config propagate before admitting anything

      - name: Deploy the signed image (expect admission)
        run: |
          kubectl create namespace aegisflow
          kubectl run auth-service-signed \
            --image="${{ needs.build-and-push.outputs.auth-image }}@${{ needs.build-and-push.outputs.auth-digest }}" \
            -n aegisflow --restart=Never
          kubectl wait --for=condition=Ready pod/auth-service-signed -n aegisflow --timeout=60s
          echo "Signed image was admitted, as expected."

      - name: Attempt to deploy the unsigned decoy (expect rejection)
        run: |
          if kubectl run unsigned-test \
            --image="${{ needs.build-and-push.outputs.auth-image }}-unsigned-demo" \
            -n aegisflow --restart=Never 2> reject.log; then
            echo "::error::Unsigned image was admitted — Kyverno policy failed to block it"
            cat reject.log
            exit 1
          fi
          echo "Unsigned image was correctly rejected by Kyverno:"
          cat reject.log
